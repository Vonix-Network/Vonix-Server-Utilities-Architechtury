plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven { url "https://maven.theillusivec4.top/" }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    // Bundle SQLite (no relocation needed — native lib loads by class name)
    shadowBundle 'org.xerial:sqlite-jdbc:3.45.1.0'

    compileOnly "top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1:api"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'

    // === Relocate bundled libraries to avoid classpath conflicts ===
    // NOTE: sqlite-jdbc must NOT be relocated. Its native library
    // (libsqlitejdbc.so) exports JNI symbols hardwired to the original
    // `org.sqlite.core.NativeDB` class name. Shadow rewrites the Java class
    // names but cannot rename the JNI symbols baked into the compiled .so,
    // so a relocated NativeDB fails to bind at runtime:
    //   java.lang.NoClassDefFoundError: org/sqlite/core/NativeDB
    // (matches the comment in the 1.20.1 Forge build.gradle and was
    //  confirmed on Protocol Zero 2026-06-24 prod boot test).
    // Forge/NeoForge isolates each mod in its own module classloader, so
    // leaving sqlite-jdbc under its real `org.sqlite` name does not collide
    // with other mods that bundle it.
    //
    // slf4j IS relocated — pure-Java, no JNI, and other mods (comforts on
    // 1.21.1 NeoForge) trigger a JPMS `exports org.slf4j.event` collision
    // otherwise:
    //   java.lang.module.ResolutionException: Modules vonix_server_utilities
    //   and org.slf4j export package org.slf4j.event to module comforts
    relocate 'org.slf4j', 'network.vonix.serverutilities.shadow.slf4j'

    // Drop signature files + license noise that breaks merged jars
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/maven/**'
    exclude 'META-INF/versions/**/module-info.class'
    exclude 'module-info.class'

    mergeServiceFiles()
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

