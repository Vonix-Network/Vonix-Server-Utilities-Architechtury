plugins {
    id 'com.gradleup.shadow'
}

loom {
    forge {
        mixinConfig "vonix_server_utilities.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }

    // Resolves the sqlite-jdbc artifact we ship via Forge JarInJar (nested jar).
    nestedJar {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
    }
}

repositories {
    mavenCentral()
    maven { url "https://maven.theillusivec4.top/" }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    compileOnly "top.theillusivec4.curios:curios-forge:1.18.2-5.0.7.1:api"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
    // slf4j-api: previously came in transitively via sqlite-jdbc shadowBundle.
    // After moving sqlite-jdbc to nestedJar, slf4j-api must be pulled in explicitly.
    shadowBundle 'org.slf4j:slf4j-api:1.7.36'

    // sqlite-jdbc via Forge JarInJar — see remapJar doLast. NOT shaded because the
    // native libsqlitejdbc.so has JNI symbols hardwired to org.sqlite.core.NativeDB
    // (relocation breaks them). Shipping unrelocated at org.sqlite collides with
    // VonixGuardian 1.0.1 in JPMS — JarInJar at the same Maven coords (3.46.1.0)
    // lets Forge's nested-jar resolver dedup so only one sqlite module loads.
    compileOnly 'org.xerial:sqlite-jdbc:3.46.1.0'
    nestedJar   'org.xerial:sqlite-jdbc:3.46.1.0'
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'

    // sqlite-jdbc is NOT shaded — ships via Forge JarInJar (see remapJar doLast).
    // slf4j is bundled by shadowBundle (transitively via :common); exporting
    // org.slf4j(.event) collides with other modpack mods → JPMS
    // ResolutionException. Relocate it into our private namespace.
    relocate 'org.slf4j', 'network.vonix.serverutilities.shadow.slf4j'

    // Drop signature files + license noise that breaks merged jars
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/maven/**'
    exclude 'META-INF/versions/**/module-info.class'
    exclude 'module-info.class'

    mergeServiceFiles()
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

// =============================================================================
// Forge JarInJar (nested jar) — sqlite-jdbc
// =============================================================================
// Architectury+loom doesn't pipe ForgeGradle's jarJar task through to the final
// remapped jar. Append the nested jar + metadata.json directly to the user-facing
// remapJar output. Pattern matches VonixGuardian 1.0.1; Forge's nested-jar
// resolver dedups against any other mod shipping the same Maven coords.
import java.util.zip.ZipFile
import java.util.zip.ZipOutputStream
import java.util.zip.ZipEntry

tasks.named('remapJar') {
    inputs.files configurations.nestedJar
    doLast {
        File outJar = archiveFile.get().asFile
        File nested = configurations.nestedJar.singleFile
        String entryName = "META-INF/jarjar/${nested.name}"
        String metadata = """{
  "jars": [
    {
      "identifier": { "group": "org.xerial", "artifact": "sqlite-jdbc" },
      "version": { "range": "[3.46.1.0,)", "artifactVersion": "3.46.1.0" },
      "path": "${entryName}",
      "isObfuscated": false
    }
  ]
}
"""
        File tmp = new File(outJar.parentFile, outJar.name + '.tmp')
        new ZipOutputStream(tmp.newOutputStream()).withCloseable { out ->
            new ZipFile(outJar).withCloseable { zf ->
                zf.entries().each { entry ->
                    if (entry.name.startsWith('META-INF/jarjar/')) return
                    out.putNextEntry(new ZipEntry(entry.name))
                    if (!entry.directory) zf.getInputStream(entry).withCloseable { it.transferTo(out) }
                    out.closeEntry()
                }
            }
            out.putNextEntry(new ZipEntry(entryName))
            nested.withInputStream { it.transferTo(out) }
            out.closeEntry()
            out.putNextEntry(new ZipEntry('META-INF/jarjar/metadata.json'))
            out.write(metadata.getBytes('UTF-8'))
            out.closeEntry()
        }
        java.nio.file.Files.move(
            tmp.toPath(), outJar.toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING,
            java.nio.file.StandardCopyOption.ATOMIC_MOVE
        )
        logger.lifecycle "Embedded JarInJar nested ${nested.name} into ${outJar.name}"
    }
}


