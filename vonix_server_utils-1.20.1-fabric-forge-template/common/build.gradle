architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    // SQLite for persistent storage (homes, warps, kit cooldowns)
    compileOnly 'org.xerial:sqlite-jdbc:3.45.1.0'

    // LuckPerms API (optional runtime dep). compileOnly so the jar never bundles LP
    // and the mod runs fine on servers without it (NoClassDefFoundError is caught
    // by LuckPermsBridge.get()).
    compileOnly 'net.luckperms:api:5.4'
}


tasks.register('crateRulesTest', JavaExec) {
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'network.vonix.serverutilities.crates.CrateRulesTest'
}

tasks.register('muteStateTest', JavaExec) {
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'network.vonix.serverutilities.moderation.MuteStateTest'
}

tasks.named('check') {
    dependsOn tasks.named('crateRulesTest')
    dependsOn tasks.named('muteStateTest')
}
