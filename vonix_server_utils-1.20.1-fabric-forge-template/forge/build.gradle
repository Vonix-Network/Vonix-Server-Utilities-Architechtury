plugins {
    id 'com.gradleup.shadow'
}

loom {
    forge {
        mixinConfig "vonix_server_utilities.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
    developmentForge.extendsFrom runtimeOnly

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }

    // Resolves the sqlite-jdbc artifact we ship via Forge JarInJar (nested jar).
    // See doLast block on remapJar below for the merge logic.
    nestedJar {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
    }
}

repositories {
    mavenCentral()
    maven { url "https://maven.theillusivec4.top/" }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    // Architectury API.
    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
    // slf4j-api: previously came in transitively via sqlite-jdbc shadowBundle.
    // After moving sqlite-jdbc to nestedJar, slf4j-api must be pulled in explicitly
    // so the relocate rule below rewrites VSU's own LoggerFactory refs to a class
    // that actually exists in the shaded jar.
    shadowBundle 'org.slf4j:slf4j-api:1.7.36'

    // sqlite-jdbc ships via Forge JarInJar (nested jar) — NOT shaded. The native
    // libsqlitejdbc.so has the JNI symbol `Java_org_sqlite_core_NativeDB_*` baked
    // into the .so, so relocating the Java class breaks JNI binding at runtime
    // (NoClassDefFoundError: org/sqlite/core/NativeDB). Shipping unrelocated
    // shaded sqlite collides with other mods (e.g. VonixGuardian 1.0.1) that
    // also ship sqlite-jdbc as a top-level org.sqlite module, causing
    // ResolutionException "Modules vonix_server_utilities and org.xerial.sqlitejdbc
    // export package org.sqlite.jdbc3 to module ...". JarInJar (matching VG 1.0.1's
    // pattern at version 3.46.1.0) lets Forge's nested-jar resolver dedup by
    // Maven coords so only one sqlite module is loaded into the layer.
    compileOnly       'org.xerial:sqlite-jdbc:3.46.1.0'
    runtimeOnly('org.xerial:sqlite-jdbc:3.46.1.0') { transitive = false }
    nestedJar         'org.xerial:sqlite-jdbc:3.46.1.0'

    compileOnly "top.theillusivec4.curios:curios-forge:5.14.1+1.20.1:api"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'

    // sqlite-jdbc is NOT shaded — it ships via Forge JarInJar (see remapJar doLast).
    // slf4j IS relocated — pure-Java, no JNI. Other modpack mods (via_romana on 1.20.1,
    // comforts on 1.21.1) bundle slf4j and trigger JPMS ResolutionException
    // (Modules org.slf4j and vonix_server_utilities export package org.slf4j to ...).
    relocate 'org.slf4j', 'network.vonix.serverutilities.shadow.slf4j'

    // Drop signature files + license noise that breaks merged jars
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/maven/**'
    exclude 'META-INF/versions/**/module-info.class'
    exclude 'module-info.class'
    // Belt-and-braces: even if a transitive dep slips sqlite into shadowBundle, drop it. JiJ is the only sqlite path.
    exclude 'org/sqlite/**'

    mergeServiceFiles()
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

// =============================================================================
// Forge JarInJar (nested jar) — sqlite-jdbc
// =============================================================================
// Architectury+loom doesn't pipe ForgeGradle's jarJar task through to the final
// remapped jar. We append the nested jar + metadata.json directly to the output
// of remapJar (the user-facing jar) using raw zip-append in doLast — matching
// the pattern used by VonixGuardian 1.0.1's build.
import java.util.zip.ZipFile
import java.util.zip.ZipOutputStream
import java.util.zip.ZipEntry

tasks.named('remapJar') {
    inputs.files configurations.nestedJar
    doLast {
        File outJar = archiveFile.get().asFile
        File nested = configurations.nestedJar.singleFile
        String entryName = "META-INF/jarjar/${nested.name}"
        String metadata = """{
  "jars": [
    {
      "identifier": { "group": "org.xerial", "artifact": "sqlite-jdbc" },
      "version": { "range": "[3.46.1.0,)", "artifactVersion": "3.46.1.0" },
      "path": "${entryName}",
      "isObfuscated": false
    }
  ]
}
"""
        File tmp = new File(outJar.parentFile, outJar.name + '.tmp')
        new ZipOutputStream(tmp.newOutputStream()).withCloseable { out ->
            new ZipFile(outJar).withCloseable { zf ->
                zf.entries().each { entry ->
                    if (entry.name.startsWith('META-INF/jarjar/')) return
                    out.putNextEntry(new ZipEntry(entry.name))
                    if (!entry.directory) zf.getInputStream(entry).withCloseable { it.transferTo(out) }
                    out.closeEntry()
                }
            }
            out.putNextEntry(new ZipEntry(entryName))
            nested.withInputStream { it.transferTo(out) }
            out.closeEntry()
            out.putNextEntry(new ZipEntry('META-INF/jarjar/metadata.json'))
            out.write(metadata.getBytes('UTF-8'))
            out.closeEntry()
        }
        java.nio.file.Files.move(
            tmp.toPath(), outJar.toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING,
            java.nio.file.StandardCopyOption.ATOMIC_MOVE
        )
        logger.lifecycle "Embedded JarInJar nested ${nested.name} into ${outJar.name}"
    }
}

