plugins {
    id 'com.gradleup.shadow'
}

loom {
    forge {
        mixinConfig "vonix_server_utilities.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven { url "https://maven.theillusivec4.top/" }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    // Architectury API.
    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    // Bundle SQLite (driver registered explicitly via Class.forName)
    shadowBundle 'org.xerial:sqlite-jdbc:3.45.1.0'

    compileOnly "top.theillusivec4.curios:curios-forge:5.14.1+1.20.1:api"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'

    // === Relocate bundled libraries to avoid classpath conflicts ===
    // NOTE: sqlite-jdbc must NOT be relocated. Its native library (libsqlitejdbc.so)
    // exports JNI symbols hardwired to the original `org.sqlite.core.NativeDB` class
    // name. Shadow rewrites the Java class names but cannot rename the JNI symbols
    // baked into the compiled .so, so a relocated NativeDB fails to bind at runtime:
    //   java.lang.NoClassDefFoundError: org/sqlite/core/NativeDB
    // (confirmed on the 1.18.2 HTTYD boot test during VSU Database.init). Forge already
    // isolates each mod in its own module classloader, so leaving sqlite-jdbc under its
    // real `org.sqlite` name does not collide with other mods that bundle it.
    // Therefore: do NOT add `relocate 'org.sqlite', ...` here.
    // (If a runtime `exports org.slf4j.event` module collision appears with a specific
    //  modpack, relocate ONLY org.slf4j -> network.vonix.serverutilities.shadow.slf4j,
    //  as done in the 1.18.2 template; slf4j is pure-Java and relocates cleanly.)
    //
    // Sunlit Valley boot test confirmed the collision is REAL on 1.20.1 too — module
    // `via_romana` also depends on slf4j and triggers the JPMS export-package error:
    //   java.lang.module.ResolutionException: Modules org.slf4j and vonix_server_utilities
    //   export package org.slf4j to module via_romana
    // The relocation below moves our bundled slf4j off the org.slf4j package so the
    // module layer no longer sees two exporters.
    relocate 'org.slf4j', 'network.vonix.serverutilities.shadow.slf4j'

    // Drop signature files + license noise that breaks merged jars
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/maven/**'
    exclude 'META-INF/versions/**/module-info.class'
    exclude 'module-info.class'

    mergeServiceFiles()
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

