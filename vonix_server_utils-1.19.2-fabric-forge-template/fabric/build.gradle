plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.ladysnake.org/releases" }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"
    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
    shadowBundle 'org.xerial:sqlite-jdbc:3.45.1.0'
    modCompileOnly "dev.emi:trinkets:3.4.1"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'

    // === Relocate bundled libraries to avoid classpath conflicts ===
    // When other mods (Iris, Carpet, FTB Library variants, some chunk-storage mods)
    // ship their own copy of sqlite-jdbc, the classloader picks one and you get
    // NoSuchFieldError / IncompatibleClassChange from cross-version class fields.
    // Relocating to a vonix-private namespace gives us our own copy that nothing
    // else can collide with. Native libs inside the jar get the same treatment.
    relocate 'org.sqlite', 'network.vonix.serverutilities.shadow.sqlite'

    // Drop signature files + license noise that breaks merged jars
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/maven/**'
    exclude 'META-INF/versions/**/module-info.class'
    exclude 'module-info.class'

    exclude 'META-INF/LICENSE*'
    exclude 'META-INF/NOTICE*'
    mergeServiceFiles()
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
