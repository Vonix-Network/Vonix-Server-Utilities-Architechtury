plugins {
    id 'com.gradleup.shadow'
}

loom {
    forge {
        mixinConfig "vonix_server_utilities.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven { url "https://maven.theillusivec4.top/" }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"
    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"
    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
    shadowBundle 'org.xerial:sqlite-jdbc:3.45.1.0'
    compileOnly "top.theillusivec4.curios:curios-forge:1.19.2-5.1.4.1:api"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'

    // === Relocate bundled libraries to avoid classpath conflicts ===
    // When other mods (Iris, Carpet, FTB Library variants, some chunk-storage mods)
    // ship their own copy of sqlite-jdbc, the classloader picks one and you get
    // NoSuchFieldError / IncompatibleClassChange from cross-version class fields.
    // Relocating to a vonix-private namespace gives us our own copy that nothing
    // else can collide with. Native libs inside the jar get the same treatment.
    relocate 'org.sqlite', 'network.vonix.serverutilities.shadow.sqlite'

    // Drop signature files + license noise that breaks merged jars
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/maven/**'
    exclude 'META-INF/versions/**/module-info.class'
    exclude 'module-info.class'

    exclude 'META-INF/LICENSE*'
    exclude 'META-INF/NOTICE*'
    mergeServiceFiles()
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

